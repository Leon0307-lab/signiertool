<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14213d">
<title>Signnora</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#14213d;--mut:#667085;--pri:#1d4ed8;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--line:#e4e7ec}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,h3{margin:.2em 0 .5em}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:8px 12px}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button.bad{color:var(--bad);border-color:#f3c5c5}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{border:1px solid #cfd4dc;border-radius:8px;padding:8px 10px;background:#fff;width:100%;color:var(--ink)}
input[type=checkbox]{width:auto}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
.hdr{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.hdr .brandwrap{margin-right:auto;cursor:pointer}
.brand img{display:block;border-radius:6px}
.brand{display:inline-flex;align-items:center;gap:8px;font-size:18px}
.wrap{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 140px}
.row>button,.row>a{flex:0 0 auto}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:#eef2f6;color:var(--mut);margin-right:4px}
.badge.signed{background:#dcfce7;color:var(--ok)}.badge.partial,.badge.sent{background:#fef3c7;color:var(--warn)}.badge.bad{background:#fee2e2;color:var(--bad)}
.mut{color:var(--mut);font-size:13px}
.err{color:var(--bad);margin:8px 0}
.doc{cursor:pointer}.doc:hover{border-color:var(--pri)}
.steps{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.steps span{padding:4px 10px;border-radius:99px;background:#e9edf3;font-size:13px}
.steps span.on{background:var(--pri);color:#fff}
.pg{position:relative;margin:0 auto 14px;box-shadow:0 1px 6px rgba(0,0,0,.2);background:#fff;max-width:900px}
.pg canvas{display:block;width:100%;height:auto}
.ov{position:absolute;inset:0}
.fld{position:absolute;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:4px;font-size:11px;overflow:hidden;touch-action:none;cursor:move;color:#111;display:flex;align-items:center;padding:0 3px;white-space:nowrap}
.fld.sel{outline:3px solid #000}
.fld .rs{position:absolute;right:0;bottom:0;width:14px;height:14px;background:var(--c);cursor:nwse-resize}
.tools{position:sticky;top:76px;z-index:15}
.tools button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.sigbox{position:absolute;border:2px dashed var(--pri);background:rgba(29,78,216,.07);display:flex;align-items:center;justify-content:center;color:var(--pri);font-size:12px;cursor:pointer;border-radius:4px}
.sigbox img{max-width:100%;max-height:100%}
.ovin{position:absolute;border:1.5px solid var(--pri);background:rgba(255,250,200,.75);border-radius:3px;padding:0 3px;width:auto}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:12px}
.modal .box{background:#fff;border-radius:12px;padding:16px;width:100%;max-width:640px;max-height:90vh;overflow:auto}
canvas.pad{width:100%;height:auto;border:1px dashed #98a2b3;border-radius:8px;touch-action:none;background:#fff}
.bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px;z-index:20}
.link{font-family:monospace;font-size:12px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:9px 16px;border-radius:99px;z-index:99}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.hero{background:linear-gradient(135deg,#14213d,#1d4ed8);color:#fff;border-radius:14px;padding:20px;margin-bottom:14px}
.hero h2{margin:0 0 4px}.hero p{margin:0;opacity:.85}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile b{display:block;font-size:26px;line-height:1.1}.tile span{color:var(--mut);font-size:13px}
.bars{display:flex;gap:8px;align-items:flex-end;height:150px;margin-top:8px}
.bg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bp{display:flex;align-items:flex-end;gap:4px;height:120px;width:100%;justify-content:center}
.bcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;width:34%;max-width:30px}
.b{width:100%;border-radius:5px 5px 0 0;background:var(--pri);min-height:2px}.b.g{background:var(--ok)}
.bcol i{font-style:normal;font-size:11px;color:var(--mut)}
.bg small{font-size:11px;color:var(--mut);margin-top:4px}
.hb{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}.hb .t{flex:1;background:#eef2f6;border-radius:6px;height:14px;overflow:hidden}.hb .f{height:100%}
.lg{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:6px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
@media print{.hdr,.noprint{display:none}}
</style>
</head>

async function sha256(buf){const h=await crypto.subtle.digest('SHA-256',buf);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}

function modal(html){
  const m=document.createElement('div');m.className='modal';

/* ---------- PDF-Rendering ---------- */
async function renderPdf(container,bytes){
  const pdf=await pdfjsLib.getDocument({data:bytes.slice()}).promise;
  const pages=[];
  for(let i=1;i<=pdf.numPages;i++){
    const page=await pdf.getPage(i);
    const vp0=page.getViewport({scale:1});
    const vp=page.getViewport({scale:1100/vp0.width});
    const wrap=document.createElement('div');wrap.className='pg';wrap.dataset.page=i;
    const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
    wrap.appendChild(cv);
    const ov=document.createElement('div');ov.className='ov';wrap.appendChild(ov);
    container.appendChild(wrap);
    await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
    pages.push({wrap,ov,aspect:vp.width/vp.height});
  }
  return pages;
}

  sb=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
  const q=new URLSearchParams(location.search);
  if(q.get('sign'))return signerView(q.get('sign'),null);
  if(q.has('verify'))return verifyView(q.get('verify'));

  session?shell(session):loginView();
})();

  <p class="mut" style="margin-top:14px"><a href="?verify">Dokument auf Echtheit prüfen</a></p></div></div>`;
  $('#f').onsubmit=async e=>{e.preventDefault();

}

/* ================= DASHBOARD ================= */
async function dashView(){
  main().innerHTML='<p class="mut">Lade…</p>';
  const {data,error}=await sb.from('documents').select('id,code,title,status,created_at,completed_at,signers(first_name,last_name,role,status)').order('created_at',{ascending:false});
  if(error){main().innerHTML='<p class="err">'+esc(error.message)+'</p>';return}
  const tot=data.length,open=data.filter(d=>d.status==='sent'||d.status==='partial').length,done=data.filter(d=>d.status==='signed').length;
  const week=data.filter(d=>Date.now()-new Date(d.created_at)<7*864e5).length;
  const now=new Date(),months=[];
  for(let i=5;i>=0;i--){const m=new Date(now.getFullYear(),now.getMonth()-i,1);
    const inM=x=>{if(!x)return false;const t=new Date(x);return t.getFullYear()===m.getFullYear()&&t.getMonth()===m.getMonth()};
    months.push({l:m.toLocaleDateString('de-DE',{month:'short'}),c:data.filter(d=>inM(d.created_at)).length,s:data.filter(d=>inM(d.completed_at)).length})}
  const mx=Math.max(1,...months.map(m=>Math.max(m.c,m.s)));
  const st=[['sent','Zur Unterschrift','#b45309'],['partial','Teilweise signiert','#d97706'],['signed','Signiert','#15803d']];
  const smax=Math.max(1,...st.map(([k])=>data.filter(d=>d.status===k).length));
  const waiting=data.filter(d=>d.status==='sent'||d.status==='partial').slice(0,5);
  main().innerHTML=`<div class="hero"><h2>Willkommen bei ${BRAND}</h2><p>${open?`${open} Dokument(e) warten auf Unterschrift.`:'Aktuell warten keine Dokumente auf Unterschrift.'}</p></div>
  <div class="tiles"><div class="tile"><b>${tot}</b><span>Dokumente gesamt</span></div><div class="tile"><b>${open}</b><span>Offen</span></div>
  <div class="tile"><b>${done}</b><span>Signiert</span></div><div class="tile"><b>${week}</b><span>Neu (7 Tage)</span></div></div>
  <div class="grid2"><div class="card"><h3>Dokumente pro Monat</h3><div class="bars">${months.map(m=>`<div class="bg"><div class="bp">
    <div class="bcol"><i>${m.c||''}</i><div class="b" style="height:${m.c/mx*100}%"></div></div>
    <div class="bcol"><i>${m.s||''}</i><div class="b g" style="height:${m.s/mx*100}%"></div></div></div><small>${esc(m.l)}</small></div>`).join('')}</div>
    <div class="lg"><span><i style="background:var(--pri)"></i>Erstellt</span><span><i style="background:var(--ok)"></i>Abgeschlossen</span></div></div>
  <div class="card"><h3>Status</h3>${st.map(([k,l,c])=>{const n=data.filter(d=>d.status===k).length;return `<div class="hb"><span style="width:130px">${l}</span><div class="t"><div class="f" style="width:${n/smax*100}%;background:${c}"></div></div><b>${n}</b></div>`}).join('')}
  <p class="mut" style="margin-top:10px">${tot?Math.round(done/tot*100):0} % aller Dokumente sind abgeschlossen.</p></div></div>
  <div class="card"><h3>Wartet auf Unterschrift</h3>${waiting.length?waiting.map(d=>{const w=d.signers.filter(s=>s.role!=='copy'&&s.status!=='signed').map(s=>esc(s.first_name+' '+s.last_name)).join(', ');
    return `<div class="doc" data-id="${d.id}" style="padding:8px 0;border-bottom:1px solid var(--line)"><b>${esc(d.title)}</b><div class="mut">${esc(d.code)} · wartet auf ${w||'–'}</div></div>`}).join(''):'<p class="mut">Nichts offen.</p>'}</div>
  <div class="card" style="text-align:center;padding:10px"><img src="${DASH_IMG}" alt="Echt Lippsk!" style="max-width:100%;max-height:220px;height:auto"></div>`;
  document.querySelectorAll('.doc').forEach(c=>c.onclick=()=>detailView(c.dataset.id));
}

/* ================= WIZARD ================= */
let W=null;
function wizStart(){W={step:1,title:'',bytes:null,sha:'',pages:0,signers:[],fields:[],tool:null,sel:null,signer:null};wizUpload()}
const stepsBar=n=>`<div class="steps">${['Dokument','Unterzeichner','Felder','Prüfen'].map((t,i)=>`<span class="${i+1===n?'on':''}">${i+1}. ${t}</span>`).join('')}</div>`;

function wizUpload(){
  main().innerHTML=stepsBar(1)+`<div class="card"><h3>Dokument hochladen</h3>
  <label>PDF-Datei (max. 8 MB)</label><input type="file" id="fi" accept="application/pdf">
  <label>Titel</label><input id="ti" value="${esc(W.title)}" placeholder="z. B. Vollmacht Max Mustermann">
  <div class="err" id="e"></div>${W.bytes?`<p class="mut">✔ ${W.pages} Seite(n) geladen</p>`:''}
  <button class="pri" id="nx" style="margin-top:10px">Weiter</button></div>`;
  $('#fi').onchange=async e=>{const f=e.target.files[0];if(!f)return;
    if(f.size>8*1024*1024){$('#e').textContent='Datei größer als 8 MB.';return}
    const buf=await f.arrayBuffer();
    try{const p=await pdfjsLib.getDocument({data:buf.slice(0)}).promise;W.pages=p.numPages}catch{$('#e').textContent='Keine gültige PDF.';return}
    W.bytes=new Uint8Array(buf);W.sha=await sha256(buf);
    if(!$('#ti').value)$('#ti').value=f.name.replace(/\.pdf$/i,'');
    $('#e').textContent='';toast('PDF geladen: '+W.pages+' Seite(n)');
  };
  $('#nx').onclick=()=>{if(!W.bytes){$('#e').textContent='Bitte PDF wählen.';return}
    W.title=$('#ti').value.trim();if(!W.title){$('#e').textContent='Bitte Titel eingeben.';return}
    if(!W.signers.length)W.signers.push(newSigner());wizSigners()};
}
const newSigner=()=>({id:uid(),role:'signer',salutation:'',first_name:'',last_name:'',email:'',phone:'',pin:''});

function wizSigners(){

  <div class="row" style="margin-top:12px"><button id="bk">Zurück</button><button class="pri" id="nx">Weiter</button></div></div>`;
  const draw=()=>{$('#sl').innerHTML=W.signers.map((s,i)=>`<div class="card" style="border-left:5px solid ${COLORS[i%6]}" data-i="${i}">
   <div class="row"><div><label>Anrede</label><select data-k="salutation"><option value="">–</option><option ${s.salutation==='Herr'?'selected':''}>Herr</option><option ${s.salutation==='Frau'?'selected':''}>Frau</option></select></div>
   <div><label>Vorname</label><input data-k="first_name" value="${esc(s.first_name)}"></div>
   <div><label>Nachname</label><input data-k="last_name" value="${esc(s.last_name)}"></div></div>
   <div class="row"><div><label>E-Mail</label><input data-k="email" type="email" value="${esc(s.email)}"></div>
   <div><label>Telefon</label><input data-k="phone" type="tel" value="${esc(s.phone)}"></div></div>

   <button data-gen="${i}" style="align-self:flex-end">Zufalls-PIN</button></div>

   document.querySelectorAll('#sl [data-k]').forEach(el=>el.oninput=()=>{W.signers[el.closest('[data-i]').dataset.i][el.dataset.k]=el.value});
   document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{W.signers.splice(b.dataset.del,1);draw()});

        const rs=document.createElement('div');rs.className='rs';el.appendChild(rs);

          const resize=e.target===rs;el.setPointerCapture(e.pointerId);const wasSel=W.sel===f.id;
          el.onpointermove=ev=>{const dx=(ev.clientX-sx)/r.width,dy=(ev.clientY-sy)/r.height;
            if(resize){f.w=clamp(ow+dx,.02,1-f.x);f.h=clamp(oh+dy,.015,1-f.y);el.style.width=f.w*100+'%';el.style.height=f.h*100+'%'}
            else{f.x=clamp(ox+dx,0,1-f.w);f.y=clamp(oy+dy,0,1-f.h);el.style.left=f.x*100+'%';el.style.top=f.y*100+'%'}};
          el.onpointerup=()=>{el.onpointermove=null;el.onpointerup=null;if(!wasSel){W.sel=f.id;draw();panel()}};
        };
        p.ov.appendChild(el)});
    });
  };
  const panel=()=>{const f=W.fields.find(x=>x.id===W.sel);
    if(!f){$('#pn').innerHTML='';return}
    $('#pn').innerHTML=`<div class="row" style="margin-top:8px"><div><label>Beschriftung</label><input id="pl" value="${esc(f.label)}"></div>
    ${f.type==='text'?`<div><label>Vorausgefüllt (optional, nicht änderbar)</label><input id="pv2" value="${esc(f.value||'')}"></div>`:''}
    ${f.type==='barcode'?`<label style="flex:0 0 auto"><input type="checkbox" id="pa" ${f.allPages?'checked':''}> auf allen Seiten</label>`
     :`<div><label>Zuständig</label><select id="ps">${sg.map(s=>`<option value="${s.id}" ${f.signerId===s.id?'selected':''}>${esc(s.first_name+' '+s.last_name)}</option>`).join('')}</select></div>
    <label style="flex:0 0 auto"><input type="checkbox" id="pr" ${f.required?'checked':''}> Pflicht</label>`}
    <button class="bad" id="pd">Löschen</button></div>`;
    $('#pl').oninput=e=>{f.label=e.target.value;draw()};
    if($('#pv2'))$('#pv2').oninput=e=>{f.value=e.target.value};
    if($('#ps'))$('#ps').onchange=e=>{f.signerId=e.target.value;draw()};
    if($('#pr'))$('#pr').onchange=e=>{f.required=e.target.checked};
    if($('#pa'))$('#pa').onchange=e=>{f.allPages=e.target.checked;draw()};
    $('#pd').onclick=()=>{W.fields=W.fields.filter(x=>x.id!==f.id);W.sel=null;draw();panel()};
  };
  pages.forEach((p,pi)=>p.ov.onclick=e=>{
    if(e.target!==p.ov)return;
    if(!W.tool){W.sel=null;draw();panel();return}
    const r=p.ov.getBoundingClientRect(),t=W.tool;
    const sz={signature:[.28,.07],text:[.3,.035],date:[.16,.035],checkbox:[.03,.03*p.aspect],barcode:[.26,.07]}[t];
    const f={id:uid(),type:t,label:{signature:'Unterschrift',text:'',date:'Datum',checkbox:'',barcode:'Barcode'}[t],page:pi+1,signerId:t==='barcode'?'':W.signer,required:t!=='date'&&t!=='barcode',value:'',allPages:false,w:sz[0],h:sz[1],x:0,y:0};
    f.x=clamp((e.clientX-r.left)/r.width-f.w/2,0,1-f.w);f.y=clamp((e.clientY-r.top)/r.height-f.h/2,0,1-f.h);
    W.fields.push(f);W.sel=f.id;W.tool=null;document.querySelectorAll('#tb [data-t]').forEach(x=>x.classList.remove('on'));draw();panel();
  });
  draw();
}

/* ================= E-MAIL-TEXT ================= */
function salutationLine(s){
  if(s.salutation==='Herr')return `Sehr geehrter Herr ${s.last_name},`;
  if(s.salutation==='Frau')return `Sehr geehrte Frau ${s.last_name},`;
  return `Guten Tag ${s.first_name} ${s.last_name},`;
}
function mailParts(doc,s,link){
  const sender=SET.sender||'';const org=SET.org?(', '+SET.org):'';
  const contact=[SET.mail,SET.phone].filter(Boolean).join(' oder ');
  const lines=[salutationLine(s),'',
   `${sender?'im Auftrag von '+sender+org+' bitten wir':'wir bitten'} Sie, das folgende Dokument elektronisch zu unterzeichnen:`,'',
   `Dokument: ${doc.title}`,`Dokument-ID: ${doc.code}`,'',
   'Zur Unterzeichnung öffnen Sie bitte Ihren persönlichen Link:','',link,''];
  if(s.pin_hash||PINS[s.id])lines.push('Der Zugang ist durch eine PIN geschützt. Die PIN erhalten Sie gesondert, nicht in dieser E-Mail.','');
  if(s.expires_at)lines.push(`Der Link ist gültig bis einschließlich ${fmtD(s.expires_at)}.`,'');
  lines.push('Die Unterzeichnung dauert nur wenige Minuten und ist mit Smartphone, Tablet oder Computer möglich. Zum Nachweis des Vorgangs werden Ihre Unterschrift, der Zeitpunkt sowie technische Verbindungsdaten (IP-Adresse, Gerät) protokolliert.','',
   'Die Echtheit und den Status des Dokuments können Sie jederzeit hier prüfen:','',verifyLink(doc.code),'',
   'Bitte geben Sie den persönlichen Link nicht an Dritte weiter.','');
  if(contact)lines.push(`Bei Rückfragen erreichen Sie uns unter ${contact}.`,'');
  lines.push('Mit freundlichen Grüßen',sender||'');
  return {subject:`Bitte um elektronische Unterzeichnung: ${doc.title}`,body:lines.join('\n')};
}

/* ================= PDF-ERZEUGUNG ================= */
async function flattenPdf(bytes){
  const src=await pdfjsLib.getDocument({data:bytes.slice()}).promise;
  const out=await PDFLib.PDFDocument.create();
  for(let i=1;i<=src.numPages;i++){
    const page=await src.getPage(i);
    const v1=page.getViewport({scale:1}),v2=page.getViewport({scale:2.2});
    const cv=document.createElement('canvas');cv.width=v2.width;cv.height=v2.height;
    const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
    await page.render({canvasContext:ctx,viewport:v2}).promise;
    const img=await out.embedJpg(cv.toDataURL('image/jpeg',.92));
    const p=out.addPage([v1.width,v1.height]);p.drawImage(img,{x:0,y:0,width:v1.width,height:v1.height});
  }
  return await out.save();
}
async function loadPdfSafe(b64){
  const src=b64ToBytes(b64);
  try{return {pdf:await PDFLib.PDFDocument.load(src),flat:false}}
  catch(e){if(!/encrypt/i.test(String(e&&e.message)))throw e;return {pdf:await PDFLib.PDFDocument.load(await flattenPdf(src)),flat:true}}
}
function barcodePng(code){
  const c=document.createElement('canvas');
  JsBarcode(c,code,{format:'CODE128',displayValue:true,fontSize:16,margin:6,height:56,background:'#ffffff'});
  return c.toDataURL('image/png');
}
async function drawBarcodes(pdf,d){
  const fs=(d.fields||[]).filter(f=>f.type==='barcode');if(!fs.length)return;
  const img=await pdf.embedPng(barcodePng(d.code));const pgs=pdf.getPages();
  for(const f of fs){
    const targets=f.allPages?pgs.map((_,i)=>i):[f.page-1];
    for(const i of targets){const pg=pgs[i];if(!pg)continue;const {width:W_,height:H_}=pg.getSize();
      const w=f.w*W_,h=f.h*H_,x=f.x*W_,y=H_-f.y*H_-h,r=Math.min(w/img.width,h/img.height);
      pg.drawImage(img,{x,y:y+(h-img.height*r),width:img.width*r,height:img.height*r})}
  }
}
async function buildStampedOriginal(d){
  const {pdf}=await loadPdfSafe(d.pdf_b64);
  await drawBarcodes(pdf,d);
  return await pdf.save();
}

async function buildSignedPdf(d,signers,events){
  const {StandardFonts,rgb}=PDFLib;
  const {pdf,flat}=await loadPdfSafe(d.pdf_b64);
  const font=await pdf.embedFont(StandardFonts.Helvetica),bold=await pdf.embedFont(StandardFonts.HelveticaBold);
  const cl=s=>String(s??'').replace(/[–—]/g,'-').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[^\x20-\x7E\xA0-\xFF]/g,'?');
  const pages=pdf.getPages();const sigImgs={};
  await drawBarcodes(pdf,d);
  for(const s of signers){if(s.status!=='signed')continue;
    const img=s.signature_png?(sigImgs[s.id]=await pdf.embedPng(s.signature_png)):null;
    for(const f of d.fields.filter(f=>f.signerId===s.id)){
      const pg=pages[f.page-1];if(!pg)continue;const {width:W_,height:H_}=pg.getSize();
      const x=f.x*W_,w=f.w*W_,h=f.h*H_,y=H_-f.y*H_-h,val=(s.field_values||{})[f.id];
      if(f.type==='signature'&&img){const r=Math.min(w/img.width,h/img.height),iw=img.width*r,ih=img.height*r;pg.drawImage(img,{x:x+(w-iw)/2,y:y+(h-ih)/2,width:iw,height:ih})}
      else if(f.type==='checkbox'){pg.drawRectangle({x,y,width:w,height:h,borderColor:rgb(0,0,0),borderWidth:.8});if(val==='true')pg.drawText('X',{x:x+w*.2,y:y+h*.18,size:h*.75,font:bold})}
      else if(f.type==='text'||f.type==='date'){const size=Math.max(6,Math.min(11,h*.62));pg.drawText(cl(val),{x:x+2,y:y+(h-size)/2+size*.15,size,font,color:rgb(0,0,.4)})}
    }}
  pages.forEach((pg,i)=>pg.drawText(cl(`Dokument-ID ${d.code} · Seite ${i+1}/${pages.length} · Audit-Trail am Ende`),{x:20,y:10,size:6.5,font,color:rgb(.4,.4,.4)}));

  /* ===== Audit-Trail nach Verordnung (EU) Nr. 910/2014 (eIDAS) ===== */
  const mono=await pdf.embedFont(StandardFonts.Courier);
  let logoImg=null;{const ls=SET.logo||DEFAULT_LOGO;try{logoImg=ls.startsWith('data:image/jpeg')?await pdf.embedJpg(ls):await pdf.embedPng(ls)}catch{}}
  const NAVY=rgb(.078,.129,.239),BLUE=rgb(.114,.306,.847),GREY=rgb(.4,.44,.5),LIGHT=rgb(.957,.965,.976),LINEC=rgb(.89,.906,.925),GREEN=rgb(.082,.502,.239),AMBER=rgb(.706,.325,.035),WHITE=rgb(1,1,1);
  const PW=595.28,PH=841.89,M=42,CW=PW-2*M;
  const sigHash={};
  for(const s of signers){if(s.signature_png)sigHash[s.id]=await sha256(b64ToBytes(s.signature_png.split(',')[1]))}
  const aps=[];let ap,y;
  const tw=(t,size,f)=>f.widthOfTextAtSize(t,size);
  const wrap=(t,size,f,maxW)=>{const out=[];
    for(const pr of cl(t).split('\n')){let cur='';
      for(const w of pr.split(' ')){let word=w;
        while(tw(word,size,f)>maxW){let k=word.length;while(k>1&&tw(word.slice(0,k),size,f)>maxW)k--;if(cur){out.push(cur);cur=''}out.push(word.slice(0,k));word=word.slice(k)}
        const test=cur?cur+' '+word:word;
        if(tw(test,size,f)>maxW&&cur){out.push(cur);cur=word}else cur=test}
      out.push(cur)}
    return out};
  const txt=(t,x,yy,size=9,f=font,color=NAVY)=>ap.drawText(cl(t),{x,y:yy,size,font:f,color});
  const txtR=(t,xr,yy,size=9,f=font,color=NAVY)=>ap.drawText(cl(t),{x:xr-tw(cl(t),size,f),y:yy,size,font:f,color});
  const newPage=first=>{ap=pdf.addPage([PW,PH]);aps.push(ap);
    if(first){
      ap.drawRectangle({x:0,y:PH-104,width:PW,height:104,color:NAVY});
      ap.drawRectangle({x:0,y:PH-108,width:PW,height:4,color:BLUE});
      txt(BRAND.toUpperCase()+' · AUDIT-TRAIL',M,PH-38,9,bold,rgb(.62,.74,1));
      txt('Zur elektronischen Signatur',M,PH-66,22,bold,WHITE);
      txt('gemäß Verordnung (EU) Nr. 910/2014 (eIDAS-Verordnung)',M,PH-86,9.5,font,rgb(.82,.87,.96));
      txtR(d.code,PW-M,PH-38,9,mono,WHITE);
      if(logoImg){ap.drawRectangle({x:PW-M-130,y:PH-94,width:130,height:46,color:WHITE});
        const r=Math.min(122/logoImg.width,38/logoImg.height);ap.drawImage(logoImg,{x:PW-M-130+(130-logoImg.width*r)/2,y:PH-94+(46-logoImg.height*r)/2,width:logoImg.width*r,height:logoImg.height*r})}
      y=PH-134;
    }else{
      ap.drawRectangle({x:0,y:PH-30,width:PW,height:30,color:NAVY});
      txt('Audit-Trail · '+d.title,M,PH-19,8.5,bold,WHITE);txtR(d.code,PW-M,PH-19,8,mono,WHITE);
      y=PH-58;
    }};
  const ensure=h=>{if(y-h<56)newPage(false)};
  const section=(n,title)=>{ensure(60);y-=10;ap.drawRectangle({x:M,y:y-4,width:3,height:16,color:BLUE});txt(n+'  '+title,M+10,y,12,bold);y-=10;ap.drawLine({start:{x:M,y},end:{x:PW-M,y},thickness:.6,color:LINEC});y-=16};
  const para=(t,size=8.8,color=NAVY,f=font)=>{for(const l of wrap(t,size,f,CW)){ensure(size+6);txt(l,M,y,size,f,color);y-=size+3.6}y-=4};
  const sub=t=>{ensure(30);txt(t,M,y,9,bold,BLUE);y-=13};
  const kv=(rows,labelW=140)=>{
    rows.forEach(([k,v,f],i)=>{
      const vf=f||font,vs=f===mono?7.6:9,pad=5;
      const ls=wrap(v||'–',vs,vf,CW-labelW-16);const h=ls.length*(vs+3)+7;
      ensure(h);
      if(i%2===0)ap.drawRectangle({x:M,y:y-h,width:CW,height:h,color:LIGHT});
      txt(k,M+8,y-pad-8.3*.8,8.3,font,GREY);
      ls.forEach((l,j)=>txt(l,M+labelW,y-pad-vs*.8-j*(vs+3),vs,vf));
      y-=h});
    y-=8};

  newPage(true);
  const nSign=signers.filter(s=>s.role!=='copy'),nDone=nSign.filter(s=>s.status==='signed').length;
  const boxes=[['STATUS',STATUS[d.status],d.status==='signed'?GREEN:AMBER],['UNTERSCHRIFTEN',`${nDone} von ${nSign.length}`,NAVY],['ABGESCHLOSSEN',d.completed_at?fmt(d.completed_at):'noch offen',NAVY]];
  const bw=(CW-20)/3;
  boxes.forEach(([k,v,c],i)=>{const x=M+i*(bw+10);
    ap.drawRectangle({x,y:y-48,width:bw,height:48,color:LIGHT,borderColor:LINEC,borderWidth:.6});
    ap.drawRectangle({x,y:y-48,width:3,height:48,color:c});
    txt(k,x+12,y-16,7.5,bold,GREY);txt(v,x+12,y-35,i===2?9.5:12,bold,c)});
  y-=58;

  section('1','Dokument und Integrität');
  kv([['Titel',d.title],['Dokument-ID',d.code],['Seiten (Original)',String(d.page_count||pages.length)],
      ...(flat?[['Hinweis zum Original','Das hochgeladene PDF war durch einen Berechtigungsschutz verschlüsselt. Für die Unterschriften wurden die Seiten als Bilddarstellung übernommen (Text nicht mehr markierbar). Der Hashwert bezieht sich auf die hochgeladene Originaldatei.']]:[]),
      ['SHA-256 des Originals',d.sha256,mono],['Erstellt am',fmt(d.created_at)+' (Europe/Berlin)'],['Abgeschlossen am',d.completed_at?fmt(d.completed_at)+' (Europe/Berlin)':'noch nicht abgeschlossen']]);

  section('2','Unterzeichner und Signaturvorgang');
  nSign.forEach((s,idx)=>{
    const done=s.status==='signed',col=done?GREEN:AMBER;
    ensure(46+34);
    ap.drawRectangle({x:M,y:y-46,width:CW,height:46,color:WHITE,borderColor:LINEC,borderWidth:.8});
    ap.drawRectangle({x:M,y:y-46,width:4,height:46,color:col});
    txt(`${idx+1}. ${s.first_name} ${s.last_name}`,M+14,y-20,11.5,bold);
    const label=done?'SIGNIERT':'AUSSTEHEND',lw=tw(label,7.5,bold)+14;
    ap.drawRectangle({x:M+14,y:y-40,width:lw,height:13,color:done?rgb(.86,.99,.91):rgb(1,.95,.78)});
    txt(label,M+21,y-36,7.5,bold,col);
    const im=sigImgs[s.id];
    if(im){const r=Math.min(110/im.width,38/im.height);ap.drawImage(im,{x:PW-M-10-im.width*r,y:y-42,width:im.width*r,height:im.height*r})}
    y-=46;
    kv([['Rolle',ROLE[s.role]],['E-Mail',s.email||'–'],['Telefon',s.phone||'–'],
        ['Zeitpunkt der Unterzeichnung',done?fmt(s.signed_at)+' (Europe/Berlin)':'noch nicht unterzeichnet'],
        ['IP-Adresse',s.signed_ip||'–'],['Endgerät / Browser',s.signed_ua||'–'],
        ['Einwilligung',done&&s.consent?'Zur elektronischen Unterzeichnung ausdrücklich erteilt':'–'],
        ['Zugriffsschutz',s.pin_hash?'Persönlicher Link und PIN (Zusatzfaktor)':'Persönlicher Link (nicht erratbarer Token)'],
        ['SHA-256 der Unterschrift',sigHash[s.id]||'–',mono]],165);
  });
  const copies=signers.filter(s=>s.role==='copy');
  if(copies.length)para('Kopie-Empfänger (ohne Signaturvorgang): '+copies.map(c=>c.first_name+' '+c.last_name+(c.email?' <'+c.email+'>':'')).join(', '),8.5,GREY);

  section('3','Ereignisprotokoll (chronologisch)');
  const cols=[['Zeitpunkt',112],['Ereignis',140],['Beteiligter',130],['IP-Adresse',CW-382]];
  const head=()=>{ensure(40);ap.drawRectangle({x:M,y:y-18,width:CW,height:18,color:NAVY});let x=M+6;cols.forEach(([n,w])=>{txt(n,x,y-12.5,8,bold,WHITE);x+=w});y-=18};
  head();
  events.forEach((v,i)=>{
    const p=signers.find(x=>x.id===v.signer_id);const who=p?p.first_name+' '+p.last_name:(v.actor||'System');
    const cells=[fmt(v.created_at),EVT[v.event]||v.event,who,v.ip||'–'];
    const ls=cells.map((c,k)=>wrap(c,8.2,font,cols[k][1]-8));
    const n=Math.max(...ls.map(a=>a.length)),h=n*11.2+7;
    if(y-h<56){newPage(false);head()}
    if(i%2===1)ap.drawRectangle({x:M,y:y-h,width:CW,height:h,color:LIGHT});
    let x=M+6;ls.forEach((a,k)=>{a.forEach((l,j)=>txt(l,x,y-5-8.2*.8-j*11.2,8.2,font));x+=cols[k][1]});
    y-=h});
  y-=8;

  section('4','Integrität und Nachprüfbarkeit');
  para('Der SHA-256-Hashwert in Abschnitt 1 identifiziert das ursprünglich hochgeladene Dokument eindeutig: Wird das unveränderte Original erneut gehasht, muss derselbe Wert entstehen. Der Hashwert der Unterschrift in Abschnitt 2 belegt, dass die im System gespeicherte Unterschriftsdatei unverändert ist. Die Ereignisse wurden serverseitig mit Zeitstempel der Datenbank protokolliert.');
  para('Echtheit und Abschlussstatus lassen sich öffentlich prüfen unter: '+verifyLink(d.code),8.8,BLUE);

  section('5','Einordnung nach Verordnung (EU) Nr. 910/2014 (eIDAS)');
  sub('Art der Signatur');
  para('Einfache elektronische Signatur im Sinne von Art. 3 Nr. 10 eIDAS-VO: Daten in elektronischer Form, die anderen elektronischen Daten beigefügt oder logisch mit ihnen verknüpft werden und die der Unterzeichner zum Unterzeichnen verwendet. Die Unterzeichner haben ihre handschriftlich gezeichnete Unterschrift dem Dokument zugeordnet und der elektronischen Unterzeichnung zugestimmt.');
  sub('Rechtswirkung (Art. 25 Abs. 1 eIDAS)');
  para('Einer elektronischen Signatur darf die Rechtswirkung und die Zulässigkeit als Beweismittel in Gerichtsverfahren nicht allein deshalb abgesprochen werden, weil sie in elektronischer Form vorliegt oder die Anforderungen an qualifizierte elektronische Signaturen nicht erfüllt. Der Beweiswert wird im Einzelfall vom Gericht gewürdigt.');
  sub('Abgrenzung');
  para('Dieses Verfahren stellt weder eine fortgeschrittene elektronische Signatur (Art. 3 Nr. 11, Art. 26) noch eine qualifizierte elektronische Signatur (Art. 3 Nr. 12) dar. Die Gleichstellung mit der handschriftlichen Unterschrift nach Art. 25 Abs. 2 gilt daher nicht; gesetzliche Schriftformerfordernisse werden dadurch nicht ersetzt. Eine Identitätsprüfung im Sinne von Art. 24 Abs. 1 hat nicht stattgefunden; die Zuordnung beruht auf dem personalisierten Signierlink (und, soweit angegeben, der PIN). Zeitangaben sind keine qualifizierten elektronischen Zeitstempel (Art. 3 Nr. 34). Dieses Dokument ist nicht durch ein elektronisches Siegel geschützt.');

  aps.forEach((p,i)=>{
    p.drawLine({start:{x:M,y:38},end:{x:PW-M,y:38},thickness:.5,color:LINEC});
    p.drawText(cl(`${BRAND} · Dokument-ID ${d.code} · Audit-Trail nach Verordnung (EU) Nr. 910/2014`),{x:M,y:26,size:7,font,color:GREY});
    const t=`Seite ${i+1} von ${aps.length}`;p.drawText(t,{x:PW-M-tw(t,7,font),y:26,size:7,font,color:GREY});
  });
  return await pdf.save();
}

/* ================= UNTERZEICHNER-ANSICHT ================= */
async function signerView(token,pin){
  if(!pin)app.innerHTML=`<div class="wrap"><p class="mut">Lade Dokument…</p></div>`;
  const {data,error}=await sb.rpc('get_signing_session',{p_token:token,p_pin:pin||null});
  if(error||!data||data.error){app.innerHTML=`<div class="hdr">${logoHtml(28)}</div><div class="wrap"><div class="card"><h2>Nicht verfügbar</h2><p>${esc(error?error.message:data?.error||'Fehler')}</p></div></div>`;return}
  if(data.pin_required){
    app.innerHTML=`<div class="hdr">${logoHtml(28)}</div><div class="wrap" style="max-width:420px;padding-top:8vh"><div class="card"><h2>Geschützter Zugang</h2>
    <p class="mut">Dieses Dokument ist durch eine PIN geschützt. Die PIN hat Ihnen der Absender mitgeteilt.</p>
    <form id="pf"><label>PIN</label><input id="pp" inputmode="numeric" autocomplete="one-time-code" maxlength="8" autofocus>
    <div class="err" id="pe">${esc(data.pin_error||'')}</div><button class="pri" style="width:100%;margin-top:8px">Dokument öffnen</button></form></div></div>`;
    $('#pf').onsubmit=e=>{e.preventDefault();const v=$('#pp').value.trim();if(v)signerView(token,v)};
    return;
  }
  const S={sig:data.signature||null,vals:{...(data.signed_values||{})},done:data.signer.status==='signed'};
  app.innerHTML=`<div class="hdr">${logoHtml(28)}<b style="margin-left:auto;font-size:14px">${esc(data.title)}</b></div>
  <div class="wrap"><div id="msg"></div><div id="pv"></div></div><div class="bar" id="bar"></div>`;
  if(S.done)$('#msg').innerHTML='<div class="card"><b>✔ Sie haben dieses Dokument bereits unterzeichnet</b> ('+fmt(data.signer.signed_at)+').</div>';
  else $('#msg').innerHTML=`<div class="card mut">Guten Tag ${esc(data.signer.first_name+' '+data.signer.last_name)}, bitte lesen Sie das Dokument, füllen Sie die gelb markierten Felder aus und unterschreiben Sie unten verbindlich.</div>`;
  const pages=await renderPdf($('#pv'),b64ToBytes(data.pdf_b64));
  const els=[];
  data.fields.forEach(f=>{const p=pages[f.page-1];if(!p)return;
    const box=(tag='div')=>{const e=document.createElement(tag);e.style.cssText=`position:absolute;left:${f.x*100}%;top:${f.y*100}%;width:${f.w*100}%;height:${f.h*100}%`;p.ov.appendChild(e);return e};
    if(f.type==='signature'){const e=box();e.className='sigbox';const r=()=>{e.innerHTML=S.sig?`<img src="${S.sig}">`:'✍ Hier unterschreiben'};r();els.push(r);
      if(!S.done)e.onclick=()=>sigPad(u=>{S.sig=u;els.forEach(x=>x())})}
    else if(f.type==='date'){const e=box();e.className='sigbox';e.style.cursor='default';e.style.borderStyle='solid';e.textContent=S.vals[f.id]||'Datum (automatisch)'}
    else if(f.type==='checkbox'){const e=box('input');e.type='checkbox';e.checked=S.vals[f.id]==='true';e.disabled=S.done;e.onchange=()=>S.vals[f.id]=String(e.checked)}
    else{const e=box('input');e.className='ovin';e.placeholder=f.label||'';e.value=f.value||S.vals[f.id]||'';e.readOnly=S.done||!!f.value;e.oninput=()=>S.vals[f.id]=e.value;e.dataset.fs=f.h;}
  });
  const fit=()=>document.querySelectorAll('.ovin').forEach(e=>{const h=e.parentElement.getBoundingClientRect().height*parseFloat(e.dataset.fs);e.style.fontSize=Math.max(10,h*.55)+'px'});
  fit();addEventListener('resize',fit);
  if(S.done){$('#bar').remove();return}
  $('#bar').innerHTML=`<label style="margin:0;color:var(--ink)"><input type="checkbox" id="cs"> Ich habe das Dokument gelesen und willige in die elektronische Unterschrift ein. Zeitpunkt, IP-Adresse und Gerätedaten werden im Audit-Trail gespeichert.</label>
   <div class="err" id="e"></div><button class="pri" id="go" style="width:100%;margin-top:6px">Verbindlich unterschreiben</button>`;
  $('#go').onclick=async()=>{
    for(const f of data.fields){if(!f.required||f.type==='date')continue;
      if(f.type==='signature'&&!S.sig){$('#e').textContent='Bitte unterschreiben.';return}
      if(f.type!=='signature'&&!f.value&&(!S.vals[f.id]||S.vals[f.id]==='false')){$('#e').textContent='Pflichtfeld fehlt: '+(f.label||'Feld');return}}
    if(!$('#cs').checked){$('#e').textContent='Bitte Einwilligung bestätigen.';return}
    $('#go').disabled=true;
    const {data:r,error:er}=await sb.rpc('submit_signing',{p_token:token,p_values:S.vals,p_signature:S.sig,p_consent:true,p_ua:navigator.userAgent,p_pin:pin||null});
    if(er||!r||r.error){$('#e').textContent=er?er.message:r.error;$('#go').disabled=false;return}
    app.innerHTML=`<div class="hdr">${logoHtml(28)}</div><div class="wrap" style="padding-top:10vh"><div class="card" style="text-align:center"><h2>✔ Erfolgreich unterzeichnet</h2><p>Vielen Dank. Ihre Unterschrift wurde gespeichert. Sie können dieses Fenster schließen.</p></div></div>`;
  };
}

function sigPad(cb){
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="box"><h3>Unterschrift</h3><canvas class="pad" width="900" height="300"></canvas>
  <div class="row" style="margin-top:8px"><button id="c">Löschen</button><button id="x">Abbrechen</button><button class="pri" id="ok">Übernehmen</button></div></div>`;
  document.body.appendChild(m);
  const cv=$('canvas',m),ctx=cv.getContext('2d');ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#0b1f6b';
  let draw=false,empty=true;
  const pt=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  cv.onpointerdown=e=>{draw=true;cv.setPointerCapture(e.pointerId);const [x,y]=pt(e);ctx.beginPath();ctx.moveTo(x,y)};
  cv.onpointermove=e=>{if(!draw)return;const [x,y]=pt(e);ctx.lineTo(x,y);ctx.stroke();empty=false};
  cv.onpointerup=()=>draw=false;
  $('#c',m).onclick=()=>{ctx.clearRect(0,0,cv.width,cv.height);empty=true};
  $('#x',m).onclick=()=>m.remove();
  $('#ok',m).onclick=()=>{if(empty)return;cb(cv.toDataURL('image/png'));m.remove()};
}

/* ================= ÖFFENTLICHE PRÜFSEITE ================= */
function verifyView(code){
  app.innerHTML=`<div class="hdr">${logoHtml(28)}</div><div class="wrap" style="max-width:680px">
  <div class="card"><h2>Dokument prüfen</h2><p class="mut">Geben Sie die Dokument-ID ein (steht als Barcode auf dem Dokument, Format DOC-JJJJMMTT-XXXXXX), um Echtheit und Abschlussstatus zu prüfen.</p>
  <div class="row"><input id="vc" placeholder="DOC-20261101-ABC123" value="${esc(code||'')}"><button class="pri" id="vb">Prüfen</button></div></div><div id="vr"></div></div>`;
  const run=async()=>{
    const c=$('#vc').value.trim();if(!c)return;
    $('#vr').innerHTML='<p class="mut">Prüfe…</p>';
    const {data,error}=await sb.rpc('verify_document',{p_code:c});
    if(error){$('#vr').innerHTML=`<div class="card err">${esc(error.message)}</div>`;return}
    if(!data||!data.found){$('#vr').innerHTML=`<div class="card"><h3 style="color:var(--bad)">✘ Kein Dokument gefunden</h3><p>Zu dieser ID existiert kein freigegebenes Dokument. Prüfen Sie die Schreibweise.</p></div>`;return}
    const ok=data.status==='signed';
    $('#vr').innerHTML=`<div class="card"><h3 style="color:${ok?'var(--ok)':'var(--warn)'}">${ok?'✔ Dokument gefunden – vollständig unterzeichnet':'Dokument gefunden – noch nicht vollständig unterzeichnet'}</h3>
    <table><tr><td>Dokument-ID</td><td><b>${esc(data.code)}</b></td></tr><tr><td>Status</td><td>${STATUS[data.status]}</td></tr>
    <tr><td>Erstellt</td><td>${fmt(data.created_at)}</td></tr><tr><td>Abgeschlossen</td><td>${data.completed_at?fmt(data.completed_at):'–'}</td></tr>
    <tr><td>Seiten</td><td>${data.page_count||'–'}</td></tr><tr><td>SHA-256 (Original)</td><td class="link" style="word-break:break-all">${esc(data.sha256)}</td></tr></table>
    <h4 style="margin-bottom:4px">Unterzeichner</h4><table>${data.signers.map(s=>`<tr><td>${esc(s.name)}</td><td>${s.status==='signed'?'<span class="badge signed">signiert</span> '+fmt(s.signed_at):'<span class="badge">offen</span>'}</td></tr>`).join('')}</table></div>
    <div class="card"><h3>Original-Datei vergleichen</h3><p class="mut">Wählen Sie die ursprüngliche PDF-Datei (vor der Unterzeichnung). Der Vergleich passiert nur in Ihrem Browser, die Datei wird nicht hochgeladen. Das fertig signierte PDF hat bewusst einen anderen Hashwert.</p>
    <input type="file" id="vf" accept="application/pdf"><div id="vm" style="margin-top:8px"></div></div>`;
    $('#vf').onchange=async e=>{const f=e.target.files[0];if(!f)return;const h=await sha256(await f.arrayBuffer());
      $('#vm').innerHTML=h===data.sha256?'<b style="color:var(--ok)">✔ Die Datei stimmt mit dem hinterlegten Original überein.</b>':'<b style="color:var(--bad)">✘ Die Datei weicht vom hinterlegten Original ab.</b>'};
  };
  $('#vb').onclick=run;$('#vc').onkeydown=e=>{if(e.key==='Enter')run()};
  if(code)run();
}
</script>
